name: Build OnePlus 9 Pro 5.4 Kernel (OpenWrt + RTL8156B)

on:
  # Experimental kernel build: manual trigger only. Do not auto-run on push.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel + AnyKernel3 + r8152 Module
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git zip unzip curl libncurses-dev ccache python3 \
            device-tree-compiler kmod file
          df -h /

      - name: Download Clang 11.0.2 r383902b1
        run: |
          mkdir -p toolchain/clang
          curl -L --fail --retry 5 --retry-delay 5 \
            -o /tmp/clang-r383902b1.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
          tar -xzf /tmp/clang-r383902b1.tar.gz -C toolchain/clang
          cat toolchain/clang/AndroidVersion.txt
          toolchain/clang/bin/clang --version

      - name: Clone GCC 4.9 toolchains
        run: |
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/rifsxd/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain/gcc64
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/rifsxd/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchain/gcc32
          for t in gcc g++ ld ar nm objcopy objdump readelf strip; do
            if [ -x "toolchain/gcc64/bin/aarch64-linux-android-$t" ]; then
              ln -sf "aarch64-linux-android-$t" "toolchain/gcc64/bin/aarch64-linux-androidkernel-$t"
            fi
          done
          toolchain/gcc64/bin/aarch64-linux-android-gcc --version | head -n1
          toolchain/gcc32/bin/arm-linux-androideabi-gcc --version | head -n1

      - name: Clone OnePlus kernel source
        run: |
          git clone --depth=1 -b oneplus/sm8350_u_14.0.0_oneplus9 \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git \
            kernel/msm-5.4
          cd kernel/msm-5.4
          git log -1 --oneline
          head -n 5 Makefile

      - name: Clone and overlay OnePlus vendor/techpack tree
        run: |
          git clone --depth=1 -b oneplus/sm8350_u_14.0.0_oneplus9 \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git \
            modules_and_devicetree
          mkdir -p vendor device
          cp -a modules_and_devicetree/vendor/. vendor/
          cp -a modules_and_devicetree/device/. device/
          cp -a modules_and_devicetree/kernel/msm-5.4/techpack/. kernel/msm-5.4/techpack/
          # Suppress the "+" that scripts/setlocalversion appends to a dirty tree.
          : > kernel/msm-5.4/.scmversion
          du -sh vendor device kernel/msm-5.4/techpack

      - name: Install Realtek r8152 v2.22.1 driver
        run: |
          cp drivers/r8152/r8152.c kernel/msm-5.4/drivers/net/usb/r8152.c
          cp drivers/r8152/compatibility.h kernel/msm-5.4/drivers/net/usb/compatibility.h
          echo 'CFLAGS_r8152.o += -Wno-error' >> kernel/msm-5.4/drivers/net/usb/Makefile
          grep -n "linux/hex.h" kernel/msm-5.4/drivers/net/usb/r8152.c || true

      - name: Prepare KABI-safe config (stock base + PID_NS + 2.5G)
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export BRAND_SHOW_FLAG=oneplus
          export CC=clang
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LLVM=1
          export LLVM_IAS=1

          cd kernel/msm-5.4
          mkdir -p out
          cp ../../configs/stock_le2120_1901.config out/.config

          # Never enable struct-mutating options (SYSVIPC, POSIX_MQUEUE,
          # CGROUP_DEVICE, CGROUP_PIDS, BRIDGE_NETFILTER, VLAN_8021Q, NF_TABLES),
          # which break KABI CRCs of the 99 prebuilt vendor/msm_drm .ko modules!
          # Also explicitly disable CONFIG_RELR to match stock RELA relocation format.
          # Stock OnePlus config uses the old CONFIG_OPPO_FINGERPRINT* names;
          # OnePlusOSS renamed them to CONFIG_OPLUS_FINGERPRINT*.  Without these
          # the fps_hal service crash-loops, which makes init report
          # sys.init.updatable_crashing and Android shows the
          # "There's an internal problem with your device" dialog.
          scripts/config --file out/.config \
            -e CONFIG_OPLUS_FINGERPRINT -e CONFIG_OPLUS_FINGERPRINT_COMMON \
            -e CONFIG_OPLUS_FINGERPRINT_QCOM \
            -e CONFIG_OPLUS_FINGERPRINT_GOODIX_OPTICAL \
            -e CONFIG_OPLUS_FINGERPRINT_JIIOV_OPTICAL \
            -e CONFIG_OPLUS_FINGERPRINT_SILEAD \
            -e CONFIG_NAMESPACES -e CONFIG_UTS_NS -e CONFIG_PID_NS -e CONFIG_NET_NS \
            -e CONFIG_DEVTMPFS \
            -e CONFIG_VETH -e CONFIG_BRIDGE -e CONFIG_MACVLAN -e CONFIG_TUN \
            -e CONFIG_OVERLAY_FS -e CONFIG_CGROUPS -e CONFIG_MEMCG -e CONFIG_CPUSETS \
            -e CONFIG_NETFILTER_XT_TARGET_TPROXY -e CONFIG_NETFILTER_XT_MATCH_SOCKET \
            -e CONFIG_IP_NF_IPTABLES -e CONFIG_IP_NF_NAT \
            -e CONFIG_IP_NF_TARGET_MASQUERADE \
            -e CONFIG_IP6_NF_IPTABLES -e CONFIG_IP6_NF_NAT \
            -e CONFIG_IP6_NF_TARGET_MASQUERADE \
            -e CONFIG_USB_RTL8152 -e CONFIG_USB_NET_CDC_NCM \
            -e CONFIG_USB_NET_AQC111 -e CONFIG_USB_NET_AX88179_178A \
            -d CONFIG_RELR \
            -d CONFIG_DEBUG_INFO -d CONFIG_DEBUG_INFO_DWARF4 \
            -d CONFIG_LOCALVERSION_AUTO

          sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION="-qgki-gd2a1055adeb0"|' out/.config
          sed -i 's|^CONFIG_LOCALVERSION_AUTO=.*|# CONFIG_LOCALVERSION_AUTO is not set|' out/.config

          make O=out ARCH=arm64 olddefconfig

          echo "=== critical config checks ==="
          for opt in \
            CONFIG_OPLUS_ARCH_FILE CONFIG_OPLUS_DEVICE_IFNO \
            CONFIG_OPLUS_FINGERPRINT CONFIG_OPLUS_FINGERPRINT_COMMON \
            CONFIG_OPLUS_FINGERPRINT_QCOM \
            CONFIG_OPLUS_FINGERPRINT_GOODIX_OPTICAL \
            CONFIG_OPLUS_FINGERPRINT_JIIOV_OPTICAL \
            CONFIG_NAMESPACES CONFIG_UTS_NS CONFIG_PID_NS CONFIG_NET_NS \
            CONFIG_DEVTMPFS \
            CONFIG_VETH CONFIG_BRIDGE CONFIG_MACVLAN CONFIG_TUN \
            CONFIG_OVERLAY_FS CONFIG_IP_NF_IPTABLES CONFIG_IP_NF_NAT \
            CONFIG_IP6_NF_IPTABLES CONFIG_IP6_NF_NAT \
            CONFIG_IP6_NF_TARGET_MASQUERADE CONFIG_USB_RTL8152 \
            CONFIG_USB_NET_CDC_NCM CONFIG_USB_NET_AQC111; do
            if ! grep -q "^$opt=y" out/.config; then
              echo "ERROR: $opt is not enabled"
              exit 1
            fi
            grep "^$opt=y" out/.config
          done

          if grep -q "^CONFIG_RELR=y" out/.config; then
            echo "ERROR: CONFIG_RELR=y must NOT be enabled (stock uses RELA)!"
            exit 1
          fi
          grep 'CONFIG_RELR' out/.config || true
          grep '^CONFIG_LOCALVERSION=' out/.config
          cp out/.config "$GITHUB_WORKSPACE/stock-config-used.txt"

      - name: Compile kernel Image (Clang 11.0.2 + LTO)
        run: |
          cd kernel/msm-5.4
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export BRAND_SHOW_FLAG=oneplus
          export CC=clang
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__ -Wno-error=unicode"

          make O=out -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image out/Module.symvers
          file out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"
          cp out/Module.symvers "$GITHUB_WORKSPACE/Module.symvers"

      - name: Verify 100% KABI CRC match against 99 stock phone modules
        run: |
          python3 scripts/verify_kabi_crc.py Module.symvers configs/phone_kabi_crc.json

      - name: Build out-of-tree r8152_2p5g.ko fallback for stock kernel
        run: |
          mkdir -p r8152-module
          cp drivers/r8152/r8152.c r8152-module/r8152_2p5g.c
          cp drivers/r8152/compatibility.h r8152-module/
          sed -i 's/#define MODULENAME "r8152"/#define MODULENAME "r8152_2p5g"/' r8152-module/r8152_2p5g.c
          printf 'obj-m := r8152_2p5g.o\nccflags-y += -Wno-error\n' > r8152-module/Makefile

          cd kernel/msm-5.4
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          make O=out M="$GITHUB_WORKSPACE/r8152-module" ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            BRAND_SHOW_FLAG=oneplus \
            modules
          cp "$GITHUB_WORKSPACE/r8152-module/r8152_2p5g.ko" "$GITHUB_WORKSPACE/r8152_2p5g.ko"
          modinfo "$GITHUB_WORKSPACE/r8152_2p5g.ko" | head -n 30

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp Image AnyKernel3/Image
          cp anykernel/anykernel.sh AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/AnyKernel3-OnePlus9Pro-OpenWrt-5.4.zip" . -x '.git/*' README.md
          cd ..
          unzip -l AnyKernel3-OnePlus9Pro-OpenWrt-5.4.zip | head -n 30

      - name: Package r8152 Magisk module (stock-kernel fallback)
        run: |
          mkdir -p magisk_out/system/lib/modules
          mkdir -p magisk_out/system/vendor/firmware/rtl_nic
          mkdir -p magisk_out/system/etc/firmware/rtl_nic
          cp r8152_2p5g.ko magisk_out/system/lib/modules/r8152_2p5g.ko
          cp firmware/rtl_nic/*.fw magisk_out/system/vendor/firmware/rtl_nic/
          cp firmware/rtl_nic/*.fw magisk_out/system/etc/firmware/rtl_nic/
          cp magisk/module.prop magisk_out/module.prop
          cp magisk/post-fs-data.sh magisk_out/post-fs-data.sh
          chmod 755 magisk_out/post-fs-data.sh
          cd magisk_out
          zip -r9 "$GITHUB_WORKSPACE/r8152-2.5G-Magisk-Module.zip" .
          cd ..
          unzip -l r8152-2.5G-Magisk-Module.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-OpenWrt-Kernel-${{ github.run_number }}
          path: |
            AnyKernel3-OnePlus9Pro-OpenWrt-5.4.zip
            r8152-2.5G-Magisk-Module.zip
            Image
            Module.symvers
            r8152_2p5g.ko
            stock-config-used.txt
          retention-days: 30
